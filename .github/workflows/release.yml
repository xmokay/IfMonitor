name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "ver=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.ver }}"
          dotnet publish src/IfMonitor -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$ver -p:FileVersion=$ver -p:InformationalVersion=$ver `
            -o publish

      - name: Rename artifact
        shell: pwsh
        run: |
          $name = "IfMonitor-${{ steps.version.outputs.tag }}-win-x64.exe"
          Copy-Item publish/IfMonitor.exe "publish/$name"
          "artifact=$name" >> $env:GITHUB_OUTPUT
        id: artifact

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: publish/${{ steps.artifact.outputs.artifact }}
