name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Parse version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "ver=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.ver }}"
          dotnet publish src/IfMonitor -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$ver -p:FileVersion=$ver -p:InformationalVersion=$ver `
            -o publish/sc

      - name: Publish framework-dependent win-x64
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.ver }}"
          dotnet publish src/IfMonitor -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true `
            -p:Version=$ver -p:FileVersion=$ver -p:InformationalVersion=$ver `
            -o publish/fd

      - name: Rename artifacts
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $sc = "IfMonitor-$tag-win-x64.exe"
          $fd = "IfMonitor-$tag-win-x64-fd.exe"
          Copy-Item publish/sc/IfMonitor.exe "publish/$sc"
          Copy-Item publish/fd/IfMonitor.exe "publish/$fd"
          "sc=$sc" >> $env:GITHUB_OUTPUT
          "fd=$fd" >> $env:GITHUB_OUTPUT
        id: artifact

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/${{ steps.artifact.outputs.sc }}
            publish/${{ steps.artifact.outputs.fd }}
